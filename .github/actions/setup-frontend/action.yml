name: Set up frontend dependencies
description: Install the pinned pnpm and restore its package store, not node_modules or browsers.
inputs:
  cache-dependency-path:
    description: Inputs defining the package store used by this job
    default: frontend/pnpm-lock.yaml
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.19.0
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
