name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, design rules, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npx --yes pnpm@11.19.0 install --frozen-lockfile
      - name: Build
        run: npx --yes pnpm@11.19.0 build
      - name: Check design rules
        run: npx --yes pnpm@11.19.0 check:design
      - name: Test
        run: npx --yes pnpm@11.19.0 test
      - name: Install browser test dependencies
        working-directory: .
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check overlay layout in Chromium
        working-directory: .
        run: npm run test:frontend:layout
