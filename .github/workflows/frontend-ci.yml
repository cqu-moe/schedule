name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    # Keep the required check on this job: a separate gate adds another runner queue.
    name: Build, design rules, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: changes
        with:
          base: ${{ github.ref }}
          predicate-quantifier: every
          filters: .github/ci-paths.yml
      - uses: ./.github/actions/setup-frontend
        if: steps.changes.outputs.code == 'true'
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            video/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: pnpm build
      - name: Check design rules
        if: steps.changes.outputs.code == 'true'
        run: pnpm check:design
      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: pnpm test
      - name: Install browser test dependencies
        if: steps.changes.outputs.code == 'true'
        timeout-minutes: 5
        working-directory: .
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          pnpm install --frozen-lockfile --ignore-scripts
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Check production overlay layout in Chromium
        if: steps.changes.outputs.code == 'true'
        working-directory: .
        run: pnpm run test:frontend:layout --production
      - name: Validate product introduction video
        if: steps.changes.outputs.code == 'true'
        working-directory: video
        run: |
          sudo apt-get install --yes ffmpeg
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run prepare:ui
          git diff --exit-code -- src/product/DayAgenda.tsx src/product/email.json public/email.html
          pnpm run lint
          pnpm run check
          pnpm exec remotion render src/index.ts ScheduleIntro out/ci-calendar.mp4 --frames=135-383 --codec=h264 --crf=18 --pixel-format=yuv420p --image-format=png --concurrency=2
          pnpm run check:video out/ci-calendar.mp4 249
