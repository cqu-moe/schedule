name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build, design rules, and tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: useblacksmith/checkout@v1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npx --yes pnpm@11.19.0 install --frozen-lockfile
      - name: Build
        run: npx --yes pnpm@11.19.0 build
      - name: Check design rules
        run: npx --yes pnpm@11.19.0 check:design
      - name: Test
        run: npx --yes pnpm@11.19.0 test
