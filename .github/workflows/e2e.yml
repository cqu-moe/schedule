name: Production application E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_web:
        description: Run the complete Firefox/WebKit release matrix
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Unrelated label events must not cancel an active PR gate. Main runs never share a group.
  group: application-e2e-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'e2e-release-browsers') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  application:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.release_web) && (github.event.action != 'labeled' || github.event.label.name == 'e2e-release-browsers')
    name: Chromium (${{ matrix.viewport }}, round ${{ matrix.round }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 1, 3, 2]
        round: [1, 2]
        viewport: [desktop, mobile]
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
      SCHEDULE_E2E_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
      - name: Check types, backend tests and shard coverage once
        if: matrix.round == 1 && matrix.viewport == 'desktop' && matrix.shard == 1
        run: npm run typecheck && npm run typecheck:e2e && npm test && node --test e2e/verify-shards.test.mjs
      - name: Run isolated journeys in this shard
        run: node e2e/run.mjs --ci-shard ${{ matrix.shard }}
      - name: Upload sanitized reports and readback images
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schedule-e2e-${{ github.sha }}-round-${{ matrix.round }}-${{ matrix.viewport }}-shard-${{ matrix.shard }}
          path: |
            .e2e/run-*/**/*.json
            .e2e/run-*/**/*.md
            .e2e/run-*/**/results/**/*.txt
            .e2e/run-*/**/*.png
            .e2e/run-*/**/runner.log
            .e2e/negative-*/**/*.json
            .e2e/negative-*/**/*.md
            .e2e/negative-*/**/results/**/*.txt
            .e2e/negative-*/**/*.png
            .e2e/negative-*/**/runner.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release-web:
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      (github.event_name == 'workflow_dispatch' && inputs.release_web) ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'e2e-release-browsers') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-release-browsers')))
    name: Release Web (${{ matrix.browser }}, ${{ matrix.viewport }}, round ${{ matrix.round }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [4, 1, 3, 2]
        browser: [firefox, webkit]
        viewport: [desktop, mobile]
        round: [1, 2]
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
      E2E_TELEMETRY_DISABLED: '1'
      SCHEDULE_E2E_BROWSER: ${{ matrix.browser }}
      SCHEDULE_E2E_VIEWPORT: ${{ matrix.viewport }}
      SCHEDULE_E2E_OUTPUT: .e2e/run-release-${{ github.run_id }}-${{ github.run_attempt }}-round-${{ matrix.round }}-${{ matrix.browser }}-${{ matrix.viewport }}-shard-${{ matrix.shard }}
      SCHEDULE_RELEASE_OUTPUT: .e2e/release-controls-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
        with:
          browser: ${{ matrix.browser }}
      - name: Check required school-event observation ordering
        if: github.event_name == 'workflow_dispatch' && matrix.round == 1 && matrix.browser == 'firefox' && matrix.viewport == 'desktop' && matrix.shard == 1
        shell: bash
        run: |
          umask 077
          mkdir -p .e2e
          private_directory="$(mktemp -d "$PWD/.e2e/private-ci-observer-XXXXXX")"
          set +e
          node --experimental-strip-types --test e2e/lifecycle-wait.test.mjs e2e/miniflare-runtime.test.mjs e2e/auth-artifact-runtime.test.mjs e2e/directory-state.test.mjs > "$private_directory/runner.log" 2>&1
          status=$?
          set -e
          printf 'Schedule observer contracts exited %d; raw output retained privately.\n' "$status"
          exit "$status"
      - name: Check release-only types and shard coverage once
        if: github.event_name == 'workflow_dispatch' && matrix.round == 1 && matrix.browser == 'firefox' && matrix.viewport == 'desktop' && matrix.shard == 1
        run: npm run typecheck:e2e && node --test e2e/verify-shards.test.mjs
      - name: Install the second engine for the six controls
        if: matrix.round == 1 && matrix.browser == 'firefox' && matrix.viewport == 'desktop' && matrix.shard == 1
        run: node node_modules/playwright-core/cli.js install --with-deps webkit
      - name: Require all six real Firefox/WebKit rejection controls
        if: matrix.round == 1 && matrix.browser == 'firefox' && matrix.viewport == 'desktop' && matrix.shard == 1
        shell: bash
        run: |
          umask 077
          private_directory="$(mktemp -d "$PWD/.e2e/private-ci-controls-XXXXXX")"
          set +e
          node e2e/release-web.mjs --self-check > "$private_directory/runner.log" 2>&1
          status=$?
          set -e
          printf 'Schedule six-control gate exited %d; raw output retained privately.\n' "$status"
          exit "$status"
      - name: Run isolated journeys in this release shard
        shell: bash
        run: |
          umask 077
          private_directory="$(mktemp -d "$PWD/.e2e/private-ci-cell-XXXXXX")"
          set +e
          node e2e/run.mjs --ci-shard ${{ matrix.shard }} > "$private_directory/runner.log" 2>&1
          status=$?
          set -e
          printf 'Schedule release cell exited %d; raw output retained privately.\n' "$status"
          exit "$status"
      - name: Upload only verified cell artifacts and safe control receipts
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schedule-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-round-${{ matrix.round }}-${{ matrix.browser }}-${{ matrix.viewport }}-shard-${{ matrix.shard }}
          path: |
            ${{ env.SCHEDULE_E2E_OUTPUT }}/**/*.json
            ${{ env.SCHEDULE_E2E_OUTPUT }}/**/*.md
            ${{ env.SCHEDULE_E2E_OUTPUT }}/**/results/**/*.txt
            ${{ env.SCHEDULE_E2E_OUTPUT }}/**/*.png
            ${{ env.SCHEDULE_E2E_OUTPUT }}/**/runner.log
            ${{ env.SCHEDULE_RELEASE_OUTPUT }}/**/*.json
            ${{ env.SCHEDULE_RELEASE_OUTPUT }}/**/*.md
            ${{ env.SCHEDULE_RELEASE_OUTPUT }}/**/results/**/*.txt
            ${{ env.SCHEDULE_RELEASE_OUTPUT }}/**/*.png
            ${{ env.SCHEDULE_RELEASE_OUTPUT }}/**/runner.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  harness:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.release_web) && (github.event.action != 'labeled' || github.event.label.name == 'e2e-release-browsers')
    name: Chromium harness rejection controls
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
      - name: Check required school-event observation ordering
        shell: bash
        run: |
          umask 077
          mkdir -p .e2e
          private_directory="$(mktemp -d "$PWD/.e2e/private-ci-observer-XXXXXX")"
          set +e
          node --experimental-strip-types --test e2e/lifecycle-wait.test.mjs e2e/miniflare-runtime.test.mjs e2e/auth-artifact-runtime.test.mjs e2e/directory-state.test.mjs > "$private_directory/runner.log" 2>&1
          status=$?
          set -e
          printf 'Schedule observer contracts exited %d; raw output retained privately.\n' "$status"
          exit "$status"
      - run: npm run test:e2e:harness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: schedule-harness-${{ github.sha }}
          path: |
            .e2e/negative-*/**/*.json
            .e2e/negative-*/**/*.md
            .e2e/negative-*/**/results/**/*.txt
            .e2e/negative-*/**/*.png
            .e2e/negative-*/**/runner.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Complete E2E matrix coverage
    needs: [changes, application, release-web, harness]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && (github.event.action != 'labeled' || github.event.label.name == 'e2e-release-browsers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NORMAL: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_web }}
      RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_web) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-release-browsers')) }}
    steps:
      - name: Require every selected matrix and control
        env:
          APPLICATION: ${{ needs.application.result }}
          RELEASE_WEB: ${{ needs.release-web.result }}
          HARNESS: ${{ needs.harness.result }}
        run: |
          if [ "$NORMAL" = true ]; then
            test "$APPLICATION" = success
            test "$HARNESS" = success
          else
            test "$APPLICATION" = skipped
            test "$HARNESS" = skipped
          fi
          if [ "$RELEASE" = true ]; then
            test "$RELEASE_WEB" = success
          else
            test "$RELEASE_WEB" = skipped
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.NORMAL == 'true'
        with:
          pattern: schedule-e2e-*
          path: .e2e/ci-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.RELEASE == 'true'
        with:
          pattern: schedule-release-*
          path: .e2e/ci-artifacts
      - name: Verify exact-once execution from actual shard evidence
        run: |
          browsers=''
          if [ "$NORMAL" = true ]; then browsers=chromium; fi
          if [ "$RELEASE" = true ]; then browsers="${browsers:+$browsers,}firefox,webkit"; fi
          node e2e/verify-shards.mjs .e2e/ci-artifacts "$browsers"
