name: Production application E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Real Auth, queue and calendar journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        viewport: [desktop, mobile]
    env:
      WRANGLER_SEND_METRICS: 'false'
      DO_NOT_TRACK: '1'
      SCHEDULE_E2E_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install-deps chromium
      - run: npm run e2e:prepare
      - run: npm run typecheck && npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:harness
        if: matrix.round == 1 && matrix.viewport == 'desktop'
      - name: Upload sanitized reports and readback images
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schedule-e2e-${{ github.sha }}-round-${{ matrix.round }}-${{ matrix.viewport }}
          path: |
            .e2e/run-*/**/*.json
            .e2e/run-*/**/*.md
            .e2e/run-*/**/results/**/*.txt
            .e2e/run-*/**/*.png
            .e2e/run-*/**/runner.log
            .e2e/negative-*/**/*.json
            .e2e/negative-*/**/*.md
            .e2e/negative-*/**/results/**/*.txt
            .e2e/negative-*/**/*.png
            .e2e/negative-*/**/runner.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
