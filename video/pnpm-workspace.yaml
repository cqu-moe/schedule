packages:
  - .
# Rendering must retain the existing cover and decode checks in postrender.
enablePrePostScripts: true
allowBuilds:
  esbuild: false

# Keep the prior npm resolutions while changing package managers.
overrides:
  "@eslint-community/regexpp": "4.12.2"
  "@jridgewell/resolve-uri": "3.1.2"
  "@types/dom-webcodecs": "0.1.13"
  "ast-types": "0.16.1"
  "graceful-fs": "4.2.11"
  '@babel/parser@>=7.29 <8': 7.29.13
